name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Khaneh3D_FIREBASE_FIRESTORE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q Khaneh3D_FIREBASE_FIRESTORE.zip -d project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/android/gradle.properties
          echo "android.enableJetifier=true" >> project/android/gradle.properties

      - name: Build APK
        run: |
          gradle -p project/android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khaneh3D-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
